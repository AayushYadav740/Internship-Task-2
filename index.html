<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Stopwatch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .stopwatch-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            min-width: 400px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .title {
            font-size: 2.5rem;
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .time-display {
            font-size: 4rem;
            font-weight: 600;
            font-family: 'Courier New', monospace;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .btn {
            padding: 15px 25px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            min-width: 100px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .start-btn {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
        }

        .start-btn:hover {
            background: linear-gradient(45deg, #45a049, #3d8b40);
        }

        .stop-btn {
            background: linear-gradient(45deg, #f44336, #d32f2f);
            color: white;
        }

        .stop-btn:hover {
            background: linear-gradient(45deg, #d32f2f, #b71c1c);
        }

        .reset-btn {
            background: linear-gradient(45deg, #2196F3, #1976D2);
            color: white;
        }

        .reset-btn:hover {
            background: linear-gradient(45deg, #1976D2, #1565C0);
        }

        .lap-btn {
            background: linear-gradient(45deg, #FF9800, #F57C00);
            color: white;
        }

        .lap-btn:hover {
            background: linear-gradient(45deg, #F57C00, #E65100);
        }

        .laps-container {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .lap-times {
            text-align: left;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .lap-times h3 {
            margin-bottom: 15px;
            text-align: center;
            color: #ffeb3b;
            font-size: 1.3rem;
        }

        .lap-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-family: 'Courier New', monospace;
        }

        .lap-item:last-child {
            border-bottom: none;
        }

        .lap-number {
            color: #4CAF50;
            font-weight: bold;
        }

        .lap-time {
            color: #2196F3;
            font-weight: bold;
        }

        .running {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        @media (max-width: 480px) {
            .stopwatch-container {
                padding: 20px;
                min-width: 320px;
            }
            
            .time-display {
                font-size: 2.5rem;
            }
            
            .btn {
                padding: 12px 20px;
                font-size: 1rem;
                min-width: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="stopwatch-container">
        <h1 class="title">Stopwatch</h1>
        
        <div class="time-display" id="timeDisplay">00:00:00</div>
        
        <div class="controls">
            <button class="btn start-btn" id="startBtn">Start</button>
            <button class="btn stop-btn" id="stopBtn">Stop</button>
            <button class="btn reset-btn" id="resetBtn">Reset</button>
            <button class="btn lap-btn" id="lapBtn">Lap</button>
        </div>

        <div class="laps-container" id="lapsContainer" style="display: none;">
            <div class="lap-times">
                <h3>Lap Times</h3>
                <div id="lapsList"></div>
            </div>
        </div>
    </div>

    <script>
        class Stopwatch {
            constructor() {
                this.startTime = 0;
                this.elapsedTime = 0;
                this.timerInterval = null;
                this.isRunning = false;
                this.lapTimes = [];
                this.lapCount = 0;

                this.timeDisplay = document.getElementById('timeDisplay');
                this.startBtn = document.getElementById('startBtn');
                this.stopBtn = document.getElementById('stopBtn');
                this.resetBtn = document.getElementById('resetBtn');
                this.lapBtn = document.getElementById('lapBtn');
                this.lapsContainer = document.getElementById('lapsContainer');
                this.lapsList = document.getElementById('lapsList');

                this.initEventListeners();
            }

            initEventListeners() {
                this.startBtn.addEventListener('click', () => this.start());
                this.stopBtn.addEventListener('click', () => this.stop());
                this.resetBtn.addEventListener('click', () => this.reset());
                this.lapBtn.addEventListener('click', () => this.lap());
            }

            start() {
                if (!this.isRunning) {
                    this.startTime = Date.now() - this.elapsedTime;
                    this.timerInterval = setInterval(() => this.updateDisplay(), 10);
                    this.isRunning = true;
                    this.timeDisplay.classList.add('running');
                    this.startBtn.textContent = 'Running';
                    this.startBtn.disabled = true;
                }
            }

            stop() {
                if (this.isRunning) {
                    clearInterval(this.timerInterval);
                    this.isRunning = false;
                    this.timeDisplay.classList.remove('running');
                    this.startBtn.textContent = 'Start';
                    this.startBtn.disabled = false;
                }
            }

            reset() {
                clearInterval(this.timerInterval);
                this.isRunning = false;
                this.elapsedTime = 0;
                this.lapTimes = [];
                this.lapCount = 0;
                this.timeDisplay.textContent = '00:00:00';
                this.timeDisplay.classList.remove('running');
                this.startBtn.textContent = 'Start';
                this.startBtn.disabled = false;
                this.lapsContainer.style.display = 'none';
                this.lapsList.innerHTML = '';
            }

            lap() {
                if (this.isRunning) {
                    this.lapCount++;
                    const currentTime = this.formatTime(this.elapsedTime);
                    this.lapTimes.unshift({ number: this.lapCount, time: currentTime });
                    this.displayLaps();
                    this.lapsContainer.style.display = 'block';
                }
            }

            updateDisplay() {
                this.elapsedTime = Date.now() - this.startTime;
                this.timeDisplay.textContent = this.formatTime(this.elapsedTime);
            }

            formatTime(milliseconds) {
                const totalSeconds = Math.floor(milliseconds / 1000);
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                const ms = Math.floor((milliseconds % 1000) / 10);

                return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}:${ms.toString().padStart(2, '0')}`;
            }

            displayLaps() {
                this.lapsList.innerHTML = '';
                this.lapTimes.forEach(lap => {
                    const lapElement = document.createElement('div');
                    lapElement.className = 'lap-item';
                    lapElement.innerHTML = `
                        <span class="lap-number">Lap ${lap.number}</span>
                        <span class="lap-time">${lap.time}</span>
                    `;
                    this.lapsList.appendChild(lapElement);
                });
            }
        }

        // Initialize the stopwatch when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            new Stopwatch();
        });

        // Add keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case ' ': // Spacebar
                    e.preventDefault();
                    document.getElementById('startBtn').click();
                    break;
                case 's':
                case 'S':
                    document.getElementById('stopBtn').click();
                    break;
                case 'r':
                case 'R':
                    document.getElementById('resetBtn').click();
                    break;
                case 'l':
                case 'L':
                    document.getElementById('lapBtn').click();
                    break;
            }
        });
    </script>
</body>
</html>
